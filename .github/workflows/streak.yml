name: Daily Streak Maintainer

on:
  schedule:
    # Runs at 00:00 UTC every day (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          CURRENT_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "- ${CURRENT_DATE}: Automated daily streak maintainer" >> log.md

      - name: Commit and push changes
        run: |
          git config --local user.name "Vagisha Kumari"
          git config --local user.email "vagishaawasthi9a.jssp@gmail.com"
          git add log.md
          git commit -m "chore: automated daily streak update [skip ci]" || exit 0
          git push
